# Deploys the static export to GitHub Pages at https://amrslam.tech
# (custom domain; github.io/AMR redirects there). Repo Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      # Custom domain serves at site root — do not set NEXT_PUBLIC_BASE_PATH=/AMR
      # (that prefix made CSS/JS 404 at amrslam.tech while HTML still loaded).
      # Publishable Supabase keys are intentional in the client bundle (RLS protects data).
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://amrslam.tech
          NEXT_PUBLIC_SUPABASE_URL: https://khucmrlbstdlbxcuboub.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_0b1_bw1g9VUc1H6ROJp0Mw_VWsTOHDb
          NEXT_PUBLIC_AUTH_ADAPTER: supabase
          NEXT_PUBLIC_CONTACT_ADAPTER: supabase
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ vars.NEXT_PUBLIC_CONTACT_ENDPOINT }}
          NEXT_PUBLIC_CONTROL_PANEL_URL: ${{ vars.NEXT_PUBLIC_CONTROL_PANEL_URL }}
      # Keep public/CNAME so Pages stays bound to amrslam.tech
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
